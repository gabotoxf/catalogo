    <style>
      /* Splash visible antes de que Vue monte (lo reemplaza al iniciar) */
      #app-splash { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #fff; }
      #app-splash .ring { width: 48px; height: 48px; border-radius: 50%; border: 4px solid #E3EAE2; border-top-color: #1B5E20; animation: splash-spin 0.8s linear infinite; }
      #app-splash p { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: #7A8F78; }
      @keyframes splash-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app"><div id="app-splash"><div class="ring"></div><p>Cargando</p></div></div>
    <script type="module" src="/src/main.js"></script>
  </body>
